<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kombat Realm</title>
    <link rel="preload" as="image" href="./images/background2-compresed.jpg"> <!-- Preload the image -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="leaves.css">
</head>
<body>
    <!-- AUDIO -->
    <audio muted id="background-audio">
        Your browser does not support the audio element.
    </audio>
    <audio id="slideDoor-audio">
        <source src="./audio/heavy-slide-door-3s.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
<!-- DOORS ANIMATION -->


    <div class="slideshow" id="slideshow"></div>

<!-- MENU MAIN -->
    <div id="blur-overlay"></div>

  <div class="menu-box">
    <div class="menu-item">
        <img src="./assets/menu/arcade.png" alt="Arcade Mode">
    </div>
    <div class="menu-item">
        <img src="./assets/menu/2-player.png" alt="2 Player">
    </div>
    <div class="menu-item">
        <img src="./assets/menu/settings.png" alt="Settings">
    </div>
    <div class="menu-item">
        <img src="./assets/menu/credits.png" alt="Credits">
    </div>
</div>
<!-- WINDOWS -->
<div class="menu-window" id="arcade-window">Arcade Mode Content</div>
<div class="menu-window" id="2player-window">2 Player Content</div>
<div class="menu-window" id="settings-window">
    <div class="settings-inner">

      <!-- Close button -->
      <button id="close-btn" aria-label="Close settings">✕</button>

      <p class="settings-title">SETTINGS</p>
      <p class="settings-subtitle">Key Bindings</p>

      <!-- Movement -->
      <p class="section-label">Movement</p>
      <div class="grid-move">
        <div class="kb-empty"></div>
        <div class="kb-key" data-action="up">
          <span class="kb-label">Up</span>
          <div class="kb-box" id="key-up">W</div>
        </div>
        <div class="kb-empty"></div>

        <div class="kb-key" data-action="left">
          <span class="kb-label">Left</span>
          <div class="kb-box" id="key-left">A</div>
        </div>
        <div class="kb-key" data-action="down">
          <span class="kb-label">BLOCK</span>
          <div class="kb-box" id="key-block">S</div>
        </div>
        <div class="kb-key" data-action="right">
          <span class="kb-label">Right</span>
          <div class="kb-box" id="key-right">D</div>
        </div>
      </div>

      <hr class="divider">

      <!-- Actions -->
      <div class="grid-actions">
        <div class="kb-key" data-action="attack">
          <span class="kb-label">Attack</span>
          <div class="kb-box" id="key-attack">J</div>
        </div>
        <div class="kb-key" data-action="special">
          <span class="kb-label">Special</span>
          <div class="kb-box" id="key-special">L</div>
        </div>
      </div>

      <hr class="divider">

      <!-- Audio -->
      <p class="section-label">Audio</p>
      <div class="audio-toggles">

        <div class="audio-row">
          <div class="audio-info">
            <span class="audio-icon">♪</span>
            <span class="audio-name">Music</span>
          </div>
          <button class="toggle-btn on" id="toggle-music" aria-pressed="true">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-state-label">ON</span>
          </button>
        </div>

        <div class="audio-row">
          <div class="audio-info">
            <span class="audio-icon">★</span>
            <span class="audio-name">Sound FX</span>
          </div>
          <button class="toggle-btn on" id="toggle-sfx" aria-pressed="true">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-state-label">ON</span>
          </button>
        </div>

      </div>

      <hr class="divider">

      <p class="hint">Click a box, then press any key to rebind</p>
      <button id="reset-btn">Reset to defaults</button>

    </div>
  </div>
<div class="menu-window" id="credits-window">Credits Content</div>


<!-- LEAVES -->
    <div id="leaves">
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i>
        <i class="leaf"></i> 
      </div>
      <div id="loader"></div>
      <div id="loadingBar">
        <div id="innerBar"></div>
        </div>
      <div id="playButton">Play</div>
      <script src="script.js"></script>
    </body>
</html>
